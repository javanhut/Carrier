# ImLazy configuration file

[settings]
# default = "build"  # Uncomment to set default command
# parallel = false   # Enable parallel dependency execution
# include = ["ci.toml"]  # Include other config files
# env_file = [".env", ".env.local"]  # Dotenv files to load

[variables]
# name = "myproject"
# output_dir = "bin"

[env]
# GO111MODULE = "on"

[commands]

[commands.example]
desc = "An example command"
run = ["echo Hello from imlazy!"]
# alias = ["ex", "e"]  # Uncomment to add aliases
# dep = []  # Add dependencies here
# env = {}  # Add environment variables here
# watch = ["**/*.go"]  # Watch patterns for watch mode
# if_changed = ["src/**/*.go"]  # Only run if these files changed
# dir = "subdir"  # Working directory for this command
# timeout = "5m"  # Timeout for command execution
# pre = ["lint"]  # Commands to run before
# post = ["notify"]  # Commands to run after (on success)
# retry = 2  # Number of retries on failure
# retry_delay = "1s"  # Delay between retries

# Platform-specific commands (use run.linux, run.darwin, run.windows)
# [commands.build]
# run.linux = ["go build -o app"]
# run.darwin = ["go build -o app"]
# run.windows = ["go build -o app.exe"]

[commands.update]
desc = "Updates the dependencies"
run = ["cargo update"]

[commands.check]
desc = "Checks the formatting in the files"
run = ["cargo fmt --check"]

[commands.install]
desc = "Installs the release build, signed with the Virtualization entitlement"
run.darwin = [
  "cargo build --release",
  "bash macos/sign.sh target/release/carrier",
  "sudo mv ./target/release/carrier /usr/local/bin/",
]

run.linux = [
  "cargo build --release",
  "sudo mv ./target/release/carrier /usr/local/bin/",
]


[commands.install-debug]
desc = "Installs a debug build, signed with the Virtualization entitlement"
alias = ["dev"]
run = [
  "cargo build",
  "bash macos/sign.sh target/debug/carrier",
  "sudo mv ./target/debug/carrier /usr/local/bin/",
]

[commands.uninstall]
desc = "Uninstalls the package"
run = ["sudo rm -rf /usr/local/bin/carrier"]

[commands.format]
desc = "Runs the format command"
alias = ["fmt"]
run = ["cargo fmt"]

[commands.test]
desc = "Runs the cargo tests"
run  = ["cargo test"]
